name: Build and publish pod image

# Publishes the SAME Dockerfile to GHCR, which pods can pull.
# registry.runpod.net is bound to the serverless build system — pods get
# "Failed to get Hub registry auth" from it — hence this second registry.
# The RunPod GitHub integration stays enabled and keeps building the
# serverless image for the fallback path; nothing here touches it.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # REQUIRED. Standard runners ship ~14GB free; this image needs far more
      # (pytorch+CUDA base, nemo_toolkit[asr], a baked 2.5GB model, ~12GB final).
      # Without this the build fails with "no space left on device".
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      # Deliberately no layer caching: type=gha caps at 10GB per repo and this
      # image exceeds that, so caching would thrash and slow the build. Builds
      # are once-per-commit and free, so ~25 min of wall time is acceptable.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
