name: Build and publish pod image

# Publishes the SAME Dockerfile to GHCR, which pods can pull.
# registry.runpod.net is bound to the serverless build system — pods get
# "Failed to get Hub registry auth" from it — hence this second registry.
# The RunPod GitHub integration stays enabled and keeps building the
# serverless image for the fallback path; nothing here touches it.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # REQUIRED. Standard runners ship ~25GB free; this build needs far more
      # (pytorch+CUDA base, nemo_toolkit[asr], a baked 2.5GB model, ~12GB final
      # image). Without this the build fails with "no space left on device".
      #
      # Done inline rather than with a third-party action: this job holds a
      # GITHUB_TOKEN with packages:write, so any action it runs can push an
      # image under our name. Removing the dependency removes that trust.
      # Only runner-provided toolchains are deleted -- nothing the build uses.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/local/lib/node_modules /usr/local/graalvm \
                      /usr/share/swift /opt/hostedtoolcache || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      # Deliberately no layer caching: type=gha caps at 10GB per repo and this
      # image exceeds that, so caching would thrash and slow the build. Build
      # wall time is not a constraint here -- pod pull time is, because a pod
      # is billed from allocation, pull included.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # zstd decompresses several times faster than gzip and a large pull is
      # often decompression-bound rather than network-bound, so this can cut
      # billed boot time. Published under SEPARATE tags, and allowed to fail:
      # the default tags stay gzip until a real pod proves its host Docker
      # accepts zstd layers (an older daemon rejects the media type).
      - name: Push zstd-compressed variant
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:zstd-latest
            ghcr.io/${{ github.repository }}:zstd-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,compression=zstd,compression-level=10,force-compression=true

      # Runs last on purpose: the pull cost we are optimizing is exactly these
      # numbers, and putting them at the end of the job means they are readable
      # from the log tail without downloading the whole build output.
      - name: Image size report
        if: always()
        run: |
          cat > /tmp/report.py <<'PY'
          import json, sys
          m = json.load(sys.stdin)
          ls = m.get("layers", [])
          print(f"  layers={len(ls)}  total_compressed={sum(l['size'] for l in ls)/1e9:.2f} GB")
          for l in sorted(ls, key=lambda x: -x["size"])[:8]:
              print(f"    {l['size']/1e9:6.2f} GB  {l['mediaType'].split('.')[-1]}")
          PY
          for t in sha-${{ github.sha }} zstd-sha-${{ github.sha }}; do
            echo "=== ghcr.io/${{ github.repository }}:$t ==="
            docker buildx imagetools inspect --raw \
              "ghcr.io/${{ github.repository }}:$t" 2>/dev/null \
              | python3 /tmp/report.py || echo "  (tag not published)"
          done
